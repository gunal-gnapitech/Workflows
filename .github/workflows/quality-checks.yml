name: Quality Checks

on:
  pull_request:
    branches:
      - dev

  push:
    branches:
      - "**"

jobs:
  quality:
    name: Type • Lint • Format • Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
